name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  idp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: idp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci (retry on registry stalls)
        run: |
          for i in 1 2 3; do
            timeout 120 npm ci --no-audit --no-fund && exit 0
            echo "npm ci attempt $i failed or timed out, retrying..."
            sleep 5
          done
          exit 1
      - run: npm run lint
      - run: npm run typecheck

  demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci (retry on registry stalls)
        run: |
          for i in 1 2 3; do
            timeout 120 npm ci --no-audit --no-fund && exit 0
            echo "npm ci attempt $i failed or timed out, retrying..."
            sleep 5
          done
          exit 1
      - run: npm run lint
